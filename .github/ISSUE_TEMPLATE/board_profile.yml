name: 🖼️ Board profile request
description: Ask for the exact real-photo view for your motherboard (or offer to build it).
labels: ["board-profile"]
body:
  - type: markdown
    attributes:
      value: |
        A board profile maps every labelled part on the maker's photo of your board. See CONTRIBUTING.md if you'd like to make it yourself; it is a great first contribution.
  - type: input
    id: board
    attributes:
      label: Motherboard
      description: Exactly as shown on Syscura's Overview page.
      placeholder: "MSI MAG B550 TOMAHAWK"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Maker's product page
      placeholder: "https://www.msi.com/Motherboard/..."
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to build this profile myself.
        - label: I can test a profile on my board.
