name: ✨ Feature idea
description: Suggest something Syscura should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Tell us about the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Problems and fixes
        - Security
        - Hardware and sensors
        - App and design
        - Other
