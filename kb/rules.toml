# Syscura knowledge base.
#
# Each rule turns Windows events into a finding: what happened in plain
# language, whether it is harmful, what to do, and which fixes are safe.
#
# Fixes may only use the agent's fixed list of actions. Nothing here can run
# an arbitrary command, and no action deletes data: actions start services,
# rename (never delete) folders, run Microsoft's own repair tools, or ask
# Microsoft Defender to scan.
#
# risk: safe    = cannot break anything; runs automatically
#       caution = changes something, with undo or a restore point; asks first
#       risky   = could change how the PC behaves; always asks, with a warning

# ---------------------------------------------------------------- software

[[rule]]
id = "svc.crash"
title = "A Windows service crashed"
category = "software"
severity = "warning"
harmful = "maybe"
group_by = "param1"
explain = "The \"{param1}\" service stopped unexpectedly ({count} times so far). Windows usually restarts it, but repeated crashes can break the feature it provides."
advice = "If it keeps happening, update or reinstall the program that owns the service. Repeated crashes of Windows' own services can mean damaged system files."
search = "Windows 11 \"{param1}\" service terminated unexpectedly fix"
[rule.match]
channel = "System"
provider = "Service Control Manager"
event_ids = [7031, 7034]
[[rule.fix]]
action = "service.ensure_running"
label = "Make sure the service is running again"
risk = "safe"
params = { service = "{param1}" }
[[rule.fix]]
action = "sfc.scan"
label = "Check and repair Windows system files (SFC)"
risk = "caution"
[[rule.verify]]
probe = "service_running"
params = { service = "{param1}" }
[[rule.verify]]
probe = "quiet"
params = { mins = "30" }

[[rule]]
id = "svc.start_failed"
title = "A service failed to start"
category = "software"
severity = "warning"
harmful = "maybe"
group_by = "param1"
explain = "Windows could not start the \"{param1}\" service ({count} times)."
advice = "Often caused by an uninstalled program leaving its service behind, or a missing dependency. Syscura can try starting it again."
search = "Windows 11 \"{param1}\" service failed to start event {event_id}"
[rule.match]
channel = "System"
provider = "Service Control Manager"
event_ids = [7000, 7009, 7011, 7023, 7024]
[[rule.fix]]
action = "service.ensure_running"
label = "Try starting the service again"
risk = "safe"
params = { service = "{param1}" }
[[rule.verify]]
probe = "service_running"
params = { service = "{param1}" }

[[rule]]
id = "app.crash"
title = "A program crashed"
category = "software"
severity = "warning"
harmful = "no"
group_by = "0"
explain = "{0} crashed ({count} times). The fault was in {3}."
advice = "Update the program. If the faulting module is a Windows file (ntdll.dll, KERNELBASE.dll) and many programs crash, run the system file check."
search = "{0} crash faulting module {3} fix"
[rule.match]
channel = "Application"
provider = "Application Error"
event_ids = [1000]
[[rule.fix]]
action = "sfc.scan"
label = "Check and repair Windows system files (SFC)"
risk = "caution"

[[rule]]
id = "app.crash_dotnet"
title = "A .NET program crashed"
category = "software"
severity = "warning"
harmful = "no"
explain = "A .NET program stopped with an unhandled error: {0}"
advice = "Update the program or reinstall it. Not a problem with Windows itself."
search = ".NET Runtime event 1026 application crash fix"
[rule.match]
channel = "Application"
provider = ".NET Runtime"
event_ids = [1025, 1026]

[[rule]]
id = "app.hang"
title = "A program stopped responding"
category = "software"
severity = "info"
harmful = "no"
group_by = "0"
explain = "{0} stopped responding and was closed ({count} times)."
advice = "Usually a problem in the program itself. Update it; if it happens with many programs, check the drive for errors."
search = "{0} not responding fix Windows 11"
[rule.match]
channel = "Application"
provider = "Application Hang"
event_ids = [1002]

[[rule]]
id = "sys.bsod"
title = "Windows crashed (blue screen)"
category = "software"
severity = "critical"
harmful = "maybe"
enrich = "bugcheck"
explain = "The PC restarted after a blue-screen crash: {StopName} ({StopCode}). {StopHint} Unsaved work was lost."
advice = "Most blue screens come from drivers (graphics, network, storage) or unstable hardware settings such as memory overclocks (XMP/EXPO). Update drivers and the BIOS; if it repeats, test with XMP/EXPO turned off."
search = "Windows 11 blue screen {StopName} {StopCode} fix"
[rule.match]
channel = "System"
provider = "WER-SystemErrorReporting"
event_ids = [1001]
[[rule.fix]]
action = "restore_point"
label = "Create a restore point first"
risk = "safe"
[[rule.fix]]
action = "sfc.scan"
label = "Check and repair Windows system files (SFC)"
risk = "caution"
[[rule.fix]]
action = "dism.restore_health"
label = "Repair the Windows image (DISM)"
risk = "caution"
[[rule.verify]]
probe = "quiet"
params = { mins = "10080" }

[[rule]]
id = "sys.power_loss"
title = "The PC turned off without shutting down"
category = "hardware"
severity = "error"
harmful = "maybe"
explain = "Windows restarted without a clean shutdown: the power was cut, the power button was held, or the PC froze or crashed."
advice = "Once is nothing to worry about. If it happens without you causing it, check the power supply, power cables and temperatures."
search = "Windows 11 Kernel-Power event 41 unexpected shutdown causes"
[rule.match]
channel = "System"
provider = "Microsoft-Windows-Kernel-Power"
event_ids = [41]

# ---------------------------------------------------------------- hardware

[[rule]]
id = "hw.whea_corrected"
title = "The hardware corrected an internal error"
category = "hardware"
severity = "warning"
harmful = "maybe"
explain = "The CPU, memory or a PCIe device reported an error that it corrected by itself ({count} times)."
advice = "Occasional corrected errors are harmless. Many of them usually point to unstable overclocking (including XMP/EXPO memory profiles) or a PCIe device. Update the BIOS and test with overclocks turned off."
search = "WHEA-Logger event {event_id} corrected hardware error fix"
[rule.match]
channel = "System"
provider = "WHEA-Logger"
event_ids = [17, 19, 47]

[[rule]]
id = "hw.whea_fatal"
title = "A fatal hardware error"
category = "hardware"
severity = "critical"
harmful = "yes"
explain = "The hardware reported an error it could not correct. This usually crashes the PC."
advice = "Remove overclocks (CPU, memory XMP/EXPO, GPU), update the BIOS, reseat memory and graphics card. If it continues, test the memory with Windows Memory Diagnostic."
search = "WHEA-Logger event {event_id} fatal hardware error"
[rule.match]
channel = "System"
provider = "WHEA-Logger"
event_ids = [18, 20, 46]

[[rule]]
id = "disk.errors"
title = "A drive reported read or write errors"
category = "storage"
severity = "error"
harmful = "yes"
explain = "Windows had trouble reading or writing a drive ({count} times). Data on it may be at risk."
advice = "Back up important files now. Check the drive's health on the Hardware page. Loose or old SATA cables cause this too."
search = "Windows disk event {event_id} error drive failing"
[rule.match]
channel = "System"
provider = "disk"
event_ids = [7, 11, 51, 153]
[[rule.fix]]
action = "chkdsk.scan"
label = "Scan drive C: for file system errors (read-only, changes nothing)"
risk = "safe"
auto = false

[[rule]]
id = "disk.ntfs"
title = "The file system reported damage"
category = "storage"
severity = "error"
harmful = "yes"
explain = "NTFS found a problem in the file system structure."
advice = "Back up important files. A file system scan can find the damage; Windows repairs it at the next restart."
search = "Ntfs event {event_id} file system corrupt fix"
[rule.match]
channel = "System"
provider = "Ntfs"
event_ids = [55, 98]
# Event 98 is also "volume is healthy" at information level.
levels = [1, 2, 3]
[[rule.fix]]
action = "chkdsk.scan"
label = "Scan drive C: for file system errors (read-only, changes nothing)"
risk = "safe"
auto = false

[[rule]]
id = "disk.low_space"
title = "A drive is almost full"
category = "storage"
severity = "warning"
harmful = "maybe"
explain = "A drive is running out of free space."
advice = "Windows and programs misbehave when a drive is nearly full. Use Settings > System > Storage to free space (Storage Sense can remove temporary files safely)."
search = "Windows 11 free up disk space safely"
[rule.match]
channel = "System"
provider = "srv"
event_ids = [2013]

[[rule]]
id = "drv.failed"
title = "A driver failed to load"
category = "software"
severity = "warning"
harmful = "maybe"
group_by = "param1"
explain = "The driver \"{param1}\" did not load ({count} times)."
advice = "Install the latest driver for that device from its maker. Leftover drivers from removed devices also cause this and are harmless."
search = "Windows 11 \"{param1}\" driver failed to load event 7026"
[rule.match]
channel = "System"
provider = "Service Control Manager"
event_ids = [7026]

[[rule]]
id = "drv.device"
title = "A device's driver did not start"
category = "software"
severity = "warning"
harmful = "no"
explain = "Windows could not load the driver for a device ({count} times)."
advice = "Check Device Manager for a device with a warning sign and update its driver."
search = "Kernel-PnP event 219 driver failed to load fix"
[rule.match]
channel = "System"
provider = "Microsoft-Windows-Kernel-PnP"
event_ids = [219]

# ---------------------------------------------------------------- updates

[[rule]]
id = "wu.install_failed"
title = "A Windows update failed to install"
category = "software"
severity = "error"
harmful = "maybe"
explain = "Windows Update could not install \"{updateTitle}\" (error {errorCode})."
advice = "Missing updates leave security holes open. The usual fix is to clear Windows Update's download cache and repair system files."
search = "Windows Update error {errorCode} fix"
[rule.match]
channel = "System"
provider = "WindowsUpdateClient"
event_ids = [20]
[[rule.fix]]
action = "service.ensure_running"
label = "Make sure the Windows Update service is running"
risk = "safe"
params = { service = "wuauserv" }
[[rule.fix]]
action = "wu.reset_cache"
label = "Reset Windows Update's download cache (old cache kept, can be undone)"
risk = "caution"
[[rule.fix]]
action = "dism.restore_health"
label = "Repair the Windows image (DISM)"
risk = "caution"
[[rule.verify]]
probe = "quiet"
params = { mins = "1440" }

# ---------------------------------------------------------------- network

[[rule]]
id = "net.dns"
title = "Websites are slow to find (DNS timeouts)"
category = "network"
severity = "warning"
harmful = "no"
explain = "Name lookups timed out {count} times recently (last: {QueryName})."
advice = "Usually the router or internet provider. Restarting the router helps; clearing Windows' DNS cache is harmless."
search = "DNS Client event 1014 name resolution timed out fix"
[rule.match]
channel = "System"
provider = "DNS-Client"
event_ids = [1014]
[rule.threshold]
count = 5
within_mins = 30
[[rule.fix]]
action = "dns.flush"
label = "Clear the DNS cache"
risk = "safe"
[[rule.verify]]
probe = "quiet"
params = { mins = "30" }

[[rule]]
id = "net.time"
title = "The clock could not sync"
category = "network"
severity = "info"
harmful = "no"
explain = "Windows could not reach the time server."
advice = "A wrong clock breaks secure websites and updates. Syscura can ask Windows to sync again."
search = "Windows time service event {event_id} time sync failed fix"
[rule.match]
channel = "System"
provider = "Time-Service"
event_ids = [129, 134]
[[rule.fix]]
action = "time.resync"
label = "Sync the clock now"
risk = "safe"

# ---------------------------------------------------------------- security

[[rule]]
id = "sec.threat"
title = "Microsoft Defender found a threat"
category = "security"
severity = "critical"
harmful = "yes"
explain = "Defender detected \"{Threat Name}\" ({Severity Name}) in {Path}. Action: {Action Name}."
advice = "Defender normally quarantines the file by itself. Run a full scan to make sure nothing else is hiding, and change passwords if the threat was a password stealer."
group_by = "Threat Name"
search = "{Threat Name} removal Microsoft Defender"
[rule.match]
channel = "Microsoft-Windows-Windows Defender/Operational"
event_ids = [1006, 1015, 1116, 1117]
[[rule.fix]]
action = "defender.quick_scan"
label = "Run a Defender quick scan"
risk = "safe"
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"
[[rule.fix]]
action = "defender.remove_threats"
label = "Let Defender remove the threats it found"
risk = "caution"
auto = false
[[rule.fix]]
action = "defender.offline_scan"
label = "Defender Offline scan (restarts the PC, finds hidden malware)"
risk = "risky"
auto = false

[[rule]]
id = "sec.defender_off"
title = "Microsoft Defender protection was turned off"
category = "security"
severity = "error"
harmful = "yes"
explain = "Part of Defender's protection was switched off (event {event_id})."
advice = "If you did not do this yourself, malware may have done it. Turn real-time protection back on and run a scan."
search = "Microsoft Defender real-time protection turned off by itself"
[rule.match]
channel = "Microsoft-Windows-Windows Defender/Operational"
event_ids = [5001, 5010, 5012]
[[rule.fix]]
action = "defender.enable_realtime"
label = "Turn real-time protection back on"
risk = "caution"
[[rule.fix]]
action = "defender.quick_scan"
label = "Run a Defender quick scan"
risk = "safe"

[[rule]]
id = "sec.defender_update"
title = "Defender could not update its virus definitions"
category = "security"
severity = "warning"
harmful = "maybe"
explain = "Defender's virus definitions failed to update, so new threats may be missed."
advice = "Usually a temporary network problem. Syscura can retry the update."
search = "Microsoft Defender event 2001 definition update failed fix"
[rule.match]
channel = "Microsoft-Windows-Windows Defender/Operational"
event_ids = [2001]
[[rule.fix]]
action = "defender.update"
label = "Update virus definitions now"
risk = "safe"

[[rule]]
id = "sec.new_service"
title = "A new service was installed"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "ServiceName"
enrich = "service_image"
explain = "\"{ServiceName}\" was installed as a service. It runs {ImagePath} as {AccountName}, start type: {StartType}."
advice = "Installers add services all the time. It deserves a look if you did not install anything just now, if the program is not signed by a known company, or if it runs from a user, Temp or Downloads folder."
search = "\"{ServiceName}\" service what is it safe"
[rule.match]
channel = "System"
provider = "Service Control Manager"
event_ids = [7045]
[[rule.fix]]
action = "defender.quick_scan"
label = "Run a Defender quick scan"
risk = "safe"
[[rule.fix]]
action = "service.disable"
label = "Disable this service (can be undone)"
risk = "risky"
params = { service = "{ServiceName}" }

[[rule]]
id = "sec.log_cleared"
title = "An event log was cleared"
category = "security"
severity = "error"
harmful = "maybe"
explain = "The {Channel} event log was cleared by {SubjectUserName}."
advice = "Some tools clear logs during cleanup, but attackers also do it to hide their tracks. If you did not do this, run a full scan."
search = "Windows event log cleared event 104 what does it mean"
[rule.match]
channel = "System"
provider = "Microsoft-Windows-Eventlog"
event_ids = [104]
[[rule.fix]]
action = "defender.quick_scan"
label = "Run a Defender quick scan"
risk = "safe"

[[rule]]
id = "sec.powershell"
title = "A suspicious PowerShell script ran"
category = "security"
severity = "error"
harmful = "maybe"
explain = "Windows flagged a PowerShell script as suspicious: {ScriptBlockText}"
advice = "Windows marks scripts that use techniques common in malware. If you were not running scripts or installing software, scan the PC."
search = "PowerShell event 4104 warning suspicious script block"
[rule.match]
channel = "Microsoft-Windows-PowerShell/Operational"
event_ids = [4104]
levels = [3]
[[rule.fix]]
action = "defender.quick_scan"
label = "Run a Defender quick scan"
risk = "safe"

# ---------------------------------------------------------------- noise

[[rule]]
id = "noise.dcom"
title = "DCOM permission warning (harmless)"
category = "noise"
severity = "info"
harmful = "no"
explain = "A built-in Windows component logged a DCOM permission message ({count} times). Microsoft documents this as expected behaviour."
advice = "Nothing to do. These messages appear on almost every Windows PC and do not affect it."
search = "DistributedCOM 10016 safe to ignore"
[rule.match]
channel = "System"
provider = "DistributedCOM"
event_ids = [10010, 10016]

# ---------------------------------------------------------------------------
# Syscura's own checks (crates/syscura-agent/src/watch.rs). These catch what
# signature-based antivirus can miss: brand-new malware still has to run
# from somewhere and keep itself starting with Windows.

[[rule]]
id = "proc.fake_system"
title = "A program pretends to be part of Windows"
category = "security"
severity = "critical"
harmful = "yes"
group_by = "Path"
explain = "A program called \"{Name}\" is running from {Path}. The real {Name} only runs from the Windows folder, so this is very likely malware disguised as part of Windows."
advice = "Do not ignore this. Scan the file with Defender, stop the program, then run a Defender Offline scan. Open its folder to see what else is there."
search = "{Name} running from wrong folder malware"
[rule.match]
channel = "Syscura/Processes"
event_ids = [1]
[[rule.fix]]
action = "defender.scan_path"
label = "Scan this file with Defender"
risk = "safe"
params = { path = "{Path}" }
[[rule.fix]]
action = "process.stop"
label = "Stop this program"
risk = "caution"
auto = false
params = { pid = "{Pid}", name = "{Name}" }
[[rule.fix]]
action = "defender.offline_scan"
label = "Defender Offline scan (restarts the PC, finds hidden malware)"
risk = "risky"
auto = false

[[rule]]
id = "proc.unsigned_user"
title = "An unsigned program runs from a user folder"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Path"
explain = "\"{Name}\" is running from {Path} and has no valid digital signature ({Signature}). Many small tools and games do this, but it is also how most malware runs."
advice = "If you installed this program yourself and trust it, press Mark as safe and Syscura will not warn about it again. Otherwise scan it with Defender."
search = "{Name} is it safe"
[rule.match]
channel = "Syscura/Processes"
event_ids = [2]
[[rule.fix]]
action = "defender.scan_path"
label = "Scan this file with Defender"
risk = "safe"
params = { path = "{Path}" }
[[rule.fix]]
action = "process.stop"
label = "Stop this program"
risk = "caution"
auto = false
params = { pid = "{Pid}", name = "{Name}" }

[[rule]]
id = "proc.document_shell"
title = "A document program started a command shell"
category = "security"
severity = "error"
harmful = "yes"
group_by = "Parent"
explain = "{Parent} started {Name} ({Path}). Documents should never start command shells; this is a common way malicious documents and e-mail attachments install malware."
advice = "Close the document you just opened and do not enable macros or editing. Run a Defender full scan. If you did not expect this, stop the program."
search = "{Parent} launched {Name} malicious document"
[rule.match]
channel = "Syscura/Processes"
event_ids = [3]
[[rule.fix]]
action = "process.stop"
label = "Stop {Name}"
risk = "caution"
auto = false
params = { pid = "{Pid}", name = "{Name}" }
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "sec.startup_unsigned"
title = "An unsigned program starts with Windows"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Path"
explain = "\"{Name}\" starts with Windows ({Where}) from {Path}, a user folder, and it has no valid digital signature ({Signature}). Most malware keeps itself running this way."
advice = "If you recognise it, press Mark as safe. If not, scan it with Defender and turn it off: Task Manager → Startup apps for Run keys and Startup folders, Task Scheduler for scheduled tasks."
search = "{Name} startup program is it safe"
[rule.match]
channel = "Syscura/Startup"
event_ids = [10]
[[rule.fix]]
action = "defender.scan_path"
label = "Scan this file with Defender"
risk = "safe"
params = { path = "{Path}" }

[[rule]]
id = "sec.startup_script"
title = "A hidden or downloading script starts with Windows"
category = "security"
severity = "error"
harmful = "maybe"
group_by = "Command"
explain = "A {Where} called \"{Name}\" runs a script with \"{Flag}\": {Command}. Hidden, encoded or downloading scripts at startup are a classic sign of malware, although some admin tools use them too."
advice = "If you do not know this item, turn it off (Task Scheduler for tasks, Task Manager → Startup apps otherwise) and run a Defender full scan."
search = "scheduled task powershell hidden encoded startup malware"
[rule.match]
channel = "Syscura/Startup"
event_ids = [11]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

# ---------------------------------------------------------------- more startup tricks

[[rule]]
id = "sec.debugger_hijack"
title = "Another program runs whenever a program starts"
category = "security"
severity = "error"
harmful = "maybe"
group_by = "Program"
explain = "Whenever {Program} starts, Windows runs {Runs} instead, through {How}. Developers and some tools use this, but malware uses it to start itself or to stop security tools from opening. On the sign-in screen's accessibility programs (sethc.exe, utilman.exe) it is a well-known backdoor."
advice = "If you did not set this up, remove it: Registry Editor → HKLM → SOFTWARE → Microsoft → Windows NT → CurrentVersion → Image File Execution Options → {Program}, delete the Debugger value. Then run a Defender full scan."
search = "Image File Execution Options Debugger {Program} malware"
[rule.match]
channel = "Syscura/Startup"
event_ids = [12]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "sec.winlogon"
title = "Windows' sign-in programs were changed"
category = "security"
severity = "error"
harmful = "maybe"
group_by = "Setting"
explain = "The {Setting} setting ({Scope}) is \"{Value}\" instead of Windows' own program. Malware adds itself here so it runs every time someone signs in."
advice = "Unless this PC is a kiosk or uses a custom shell on purpose, run a Defender full scan and a Defender Offline scan, then set it back to explorer.exe (Shell) or userinit.exe in System32 (Userinit)."
search = "Winlogon {Setting} value changed malware"
[rule.match]
channel = "Syscura/Startup"
event_ids = [13]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"
[[rule.fix]]
action = "defender.offline_scan"
label = "Defender Offline scan (restarts the PC, finds hidden malware)"
risk = "risky"
auto = false

[[rule]]
id = "sec.appinit"
title = "A DLL is loaded into every program (AppInit_DLLs)"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Dlls"
explain = "Windows is told to load {Dlls} into every {Bits} program that shows a window. A few old programs did this; today it is mostly malware and adware."
advice = "If you do not recognise the file, scan it with Defender and remove the AppInit_DLLs value."
search = "AppInit_DLLs {Dlls}"
[rule.match]
channel = "Syscura/Startup"
event_ids = [14]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "sec.wmi_persistence"
title = "A hidden WMI task runs commands"
category = "security"
severity = "error"
harmful = "maybe"
group_by = "Name"
explain = "A WMI event subscription called \"{Name}\" {Kind}: {Runs}. This file-less way to start programs does not show up in Task Manager or Task Scheduler; advanced malware likes it, though a few management tools use it."
advice = "If you do not know \"{Name}\", run a Defender full scan and search the web for the name. Removing it needs PowerShell as administrator (Get-CimInstance -Namespace root/subscription)."
search = "WMI event consumer \"{Name}\" malware"
[rule.match]
channel = "Syscura/Startup"
event_ids = [15]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "sec.service_user"
title = "An unsigned service runs from a user folder"
category = "security"
severity = "error"
harmful = "maybe"
group_by = "Path"
explain = "The \"{Service}\" service runs {Path} with full system rights, and the file has no valid signature ({Signature}). Real services live in Program Files or Windows; one in a user, Temp or ProgramData folder is a strong malware sign."
advice = "If you do not recognise it, scan the file with Defender and disable the service."
search = "\"{Service}\" service is it malware"
[rule.match]
channel = "Syscura/Startup"
event_ids = [16]
[[rule.fix]]
action = "defender.scan_path"
label = "Scan this file with Defender"
risk = "safe"
params = { path = "{Path}" }
[[rule.fix]]
action = "service.disable"
label = "Disable this service"
risk = "risky"
params = { service = "{Service}" }

# ---------------------------------------------------------------- network tampering

[[rule]]
id = "net.hosts_security"
title = "The hosts file blocks a security or update site"
category = "security"
severity = "error"
harmful = "maybe"
group_by = "Host"
explain = "Windows' hosts file ({Path}) sends {Host} to {Address}, so it {Why}. Malware does this so Windows Update and antivirus can no longer update or clean it."
advice = "Unless you added this line yourself, open Notepad as administrator, remove the line for {Host} from the hosts file, then run a Defender full scan."
search = "hosts file {Host} blocked malware"
[rule.match]
channel = "Syscura/Network"
event_ids = [20]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "net.hosts_redirect"
title = "The hosts file sends a popular site somewhere else"
category = "security"
severity = "error"
harmful = "yes"
group_by = "Host"
explain = "Windows' hosts file ({Path}) sends {Host} to {Address} instead of the real site. This is how fake sign-in pages steal passwords."
advice = "Do not sign in to {Host} until this is fixed. Remove the line from the hosts file (Notepad as administrator), run a Defender full scan, and change your password from another device if you signed in recently."
search = "hosts file redirect {Host} phishing"
[rule.match]
channel = "Syscura/Network"
event_ids = [21]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"
[[rule.fix]]
action = "dns.flush"
label = "Clear the DNS cache (after fixing the hosts file)"
risk = "safe"
auto = false

[[rule]]
id = "net.proxy"
title = "Internet traffic goes through a proxy"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Proxy"
explain = "Traffic of {Scope} is sent through {Proxy}. Workplaces, VPNs and ad blockers set proxies; some malware does it to watch or change what you browse."
advice = "If you do not use a VPN, work proxy or filtering tool, turn it off in Settings → Network & internet → Proxy and run a Defender full scan."
search = "Windows proxy set by itself {Proxy}"
[rule.match]
channel = "Syscura/Network"
event_ids = [22]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "net.dns_unknown"
title = "An unknown DNS server is set by hand"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Server"
explain = "Website names are looked up through {Server} ({Family}), which was typed into the network settings and is not a well-known public DNS service. Changing DNS is how some malware sends people to fake sites."
advice = "If you or your workplace did not choose this server, set DNS back to automatic (Settings → Network & internet → your connection → DNS server assignment: Automatic) and run a Defender full scan."
search = "DNS server {Server}"
[rule.match]
channel = "Syscura/Network"
event_ids = [23]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

[[rule]]
id = "net.forced_extension"
title = "A browser extension is forced on"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Extension"
explain = "A policy ({Scope}) makes {Browser} install the extension {Extension} from {Source}, and it cannot be removed in the browser. Workplaces do this; so does adware that reads everything you browse."
advice = "If this is not a work PC, search the extension id to see what it is. To remove it, delete it from the ExtensionInstallForcelist policy in the registry and run a Defender full scan."
search = "{Browser} extension {Extension}"
[rule.match]
channel = "Syscura/Network"
event_ids = [24]
[[rule.fix]]
action = "defender.full_scan"
label = "Run a Defender full scan (takes a while)"
risk = "caution"

# ---------------------------------------------------------------- drivers

[[rule]]
id = "drv.vulnerable"
title = "A driver with a known security hole is installed"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Path"
explain = "{Path} ({KnownAs}, service \"{Service}\", loads {Loads}) is on the LOLDrivers list of drivers with known security holes. Malware can load such a driver to switch off antivirus and take over Windows. Usually an old hardware, overclocking or anti-cheat tool installed it."
advice = "Update or uninstall the program that installed it (its folder and the service name say which). Microsoft's vulnerable driver blocklist (Security page) stops most of these drivers from loading."
search = "{KnownAs} vulnerable driver"
[rule.match]
channel = "Syscura/Drivers"
event_ids = [30]
[[rule.fix]]
action = "driverblocklist.enable"
label = "Turn on Microsoft's vulnerable driver blocklist"
risk = "caution"

[[rule]]
id = "drv.malicious"
title = "A known malicious driver is installed"
category = "security"
severity = "critical"
harmful = "yes"
group_by = "Path"
explain = "{Path} ({KnownAs}, service \"{Service}\", loads {Loads}) is a driver known to belong to malware (LOLDrivers list). Drivers run inside Windows itself, below antivirus."
advice = "Run a Defender Offline scan now. If Defender cannot remove it, back up your files and reinstall Windows."
search = "{KnownAs} malicious driver"
[rule.match]
channel = "Syscura/Drivers"
event_ids = [31]
[[rule.fix]]
action = "defender.scan_path"
label = "Scan this file with Defender"
risk = "safe"
params = { path = "{Path}" }
[[rule.fix]]
action = "defender.offline_scan"
label = "Defender Offline scan (restarts the PC, finds hidden malware)"
risk = "risky"
auto = false

# ---------------------------------------------------------------- ransomware tripwire

[[rule]]
id = "sec.ransomware"
title = "Files are being encrypted (ransomware tripwire)"
category = "security"
severity = "critical"
harmful = "yes"
group_by = "Folder"
explain = "Syscura's hidden tripwire file in {Folder} ({User}): {What}. Nothing should touch it; ransomware encrypts every file it finds, so files are probably being encrypted right now."
advice = "Act now: disconnect from the internet (Wi-Fi off, cable out) and unplug backup drives. Do not restart. Let Defender scan, and check Task Manager for programs you do not know. If many files already have strange extensions, get professional help before paying anything."
search = "ransomware what to do first steps"
[rule.match]
channel = "Syscura/Ransomware"
event_ids = [40]
[[rule.fix]]
action = "defender.quick_scan"
label = "Defender quick scan"
risk = "safe"
[[rule.fix]]
action = "defender.enable_cfa"
label = "Turn on Controlled folder access (blocks unknown programs from your files)"
risk = "caution"

[[rule]]
id = "sec.canary_gone"
title = "A ransomware tripwire file was deleted"
category = "security"
severity = "warning"
harmful = "maybe"
group_by = "Folder"
explain = "Syscura's hidden tripwire file in {Folder} ({User}) was deleted. A clean-up tool or a person may have removed it; Syscura put it back."
advice = "If you deleted it, press Mark as safe. If it keeps disappearing, run a Defender full scan."
[rule.match]
channel = "Syscura/Ransomware"
event_ids = [41]

# ---------------------------------------------------------------- drive health over time

[[rule]]
id = "disk.wear_fast"
title = "A drive is wearing out quickly"
category = "hardware"
severity = "warning"
harmful = "maybe"
group_by = "Disk"
explain = "{Disk}: {Detail} A program writing constantly (a misconfigured download or backup, or a game cache) usually causes this."
advice = "Check Task Manager's Disk column for programs writing all the time, and keep a current backup."
search = "SSD wear increasing fast Windows"
[rule.match]
channel = "Syscura/Disks"
event_ids = [50]

[[rule]]
id = "disk.worn"
title = "A drive is near the end of its rated life"
category = "hardware"
severity = "error"
harmful = "yes"
group_by = "Disk"
explain = "{Disk}: {Detail} Drives often keep working past 100%, but failure becomes more likely."
advice = "Back up now and plan to replace the drive."
search = "SSD percentage used 90 replace"
[rule.match]
channel = "Syscura/Disks"
event_ids = [51]

[[rule]]
id = "disk.hot"
title = "A drive runs hot"
category = "hardware"
severity = "warning"
harmful = "maybe"
group_by = "Disk"
explain = "{Disk}: {Detail} Above about 70 °C drives slow themselves down and age faster."
advice = "Check the PC's airflow and fans; an NVMe drive may need a heatsink."
search = "NVMe SSD temperature too high"
[rule.match]
channel = "Syscura/Disks"
event_ids = [52]

[[rule]]
id = "disk.health_dropped"
title = "A drive's health got worse"
category = "hardware"
severity = "error"
harmful = "yes"
group_by = "Disk"
explain = "{Disk}: {Detail}"
advice = "Back up your files now. Then check the drive with its maker's tool and replace it if it keeps failing."
search = "Windows disk health warning unhealthy"
[rule.match]
channel = "Syscura/Disks"
event_ids = [53]
[[rule.fix]]
action = "chkdsk.scan"
label = "Check drive C: (read-only)"
risk = "safe"
auto = false
