[package]
name = "syscura-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syscura desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syscura-core = { path = "../../crates/syscura-core" }
syscura-hw = { path = "../../crates/syscura-hw" }
syscura-online = { path = "../../crates/syscura-online" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation"] }
tauri-plugin-notification = "2.5.1"
