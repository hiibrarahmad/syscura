[package]
name = "syscura-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syscura desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
syscura-core = { path = "../../crates/syscura-core" }
syscura-hw = { path = "../../crates/syscura-hw" }
syscura-online = { path = "../../crates/syscura-online" }
